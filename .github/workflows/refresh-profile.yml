name: Refresh ASCII profile

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile.json
      - scripts/generate_profile.py
      - scripts/requirements.txt
      - assets/portrait-source.json
      - assets/mono.ttf
      - .github/workflows/refresh-profile.yml

permissions:
  contents: write

concurrency:
  group: ascii-profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install image dependency
        run: python -m pip install -r scripts/requirements.txt
      - name: Generate portrait, stats and typing animations
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/generate_profile.py
      - name: Commit updated profile assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-*.gif assets/profile-*.svg assets/profile-*.png assets/portrait.txt assets/stats.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh ASCII profile and public GitHub stats"
          git push
